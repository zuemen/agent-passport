name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge build --sizes
      - run: forge test -vv
      - name: The same suite on Foundry's Monad EVM
        run: forge test --network monad
      - name: Fork test against the official ERC-8004 deployment on Monad testnet
        env:
          MONAD_FORK_URL: https://testnet-rpc.monad.xyz
        run: |
          # Skipped only when the public RPC does not answer; a failing test fails the build.
          if [ "$(cast chain-id --rpc-url "$MONAD_FORK_URL" 2>/dev/null)" != "10143" ]; then
            echo "::warning::Monad testnet RPC unreachable, fork test skipped"
            exit 0
          fi
          forge test --match-path "test/fork/*" --network monad -vv

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: forge build
        working-directory: contracts
      - run: npm ci
      - run: npm run build -w sdk
      - run: npm test -w sdk
      - run: npm run build -w mcp-server
      - run: npm test -w mcp-server
      - run: npm test -w @agent-passport/verifier
      - run: npm run build -w demo

  local-scenario:
    # The whole storyline on a fresh local chain: deploy, issue, act, refuse, revoke — no keys, no testnet.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: forge build
        working-directory: contracts
      - run: npm ci
      - run: npm run build -w sdk
      - run: npm run scenario:local -w demo

  mutants:
    # Remove one rule at a time from a scratch copy of the contracts; the tests aimed at it must fail.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: bash script/mutants.sh
